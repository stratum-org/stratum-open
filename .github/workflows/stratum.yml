# Stratum reviewing its own PRs, with the same workflow as examples/stratum.yml.
# The action comes from the default branch's checkout, never from the PR.
name: Stratum

on:
  pull_request_target:
    # closed and converted_to_draft only rebuild the triage queue: the PR leaves it.
    types: [opened, synchronize, reopened, ready_for_review, closed, converted_to_draft]
  issue_comment:
    types: [created]
  # A reply in an inline thread. On a PR from a fork, GitHub gives this run a
  # read-only token, so a reply there can't run a command: each inline comment
  # then names the comment to post on the PR instead (`/stratum ignore <fingerprint>`).
  pull_request_review_comment:
    types: [created]
  # Optional: re-sort a PR when your CI finishes, so its label sees the result.
  # Name your CI workflows here. (GitHub leaves fork PRs out of these events.)
  # workflow_run:
  #   workflows: [tests]
  #   types: [completed]
  schedule:
    - cron: "17 6 * * *"  # once a day: rebuild the triage queue issue, and keep Ollama in the cache
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  # Reads the workflow runs, to tell CI waiting for a maintainer's approval (a
  # first-time contributor's PR) from CI that passed. Needed on a private repo.
  actions: read

jobs:
  stratum:
    # A comment starts the job only if it might hold a command: "/stratum " (with the
    # space, so a link to stratum-org/stratum-open doesn't).
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.action != 'converted_to_draft') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      contains(github.event.comment.body, '/stratum ')
    runs-on: ubuntu-latest
    # pull_request_target runs without GitHub's "Approve and run" gate for forks, so a
    # PR from anyone outside the team waits in the external-pr environment until a
    # maintainer approves it (Review deployments). Our own PRs, comments, the
    # schedule and manual runs take no environment and start as before.
    environment: ${{ github.event_name == 'pull_request_target' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && 'external-pr' || '' }}
    # On the job, not the workflow, so a comment without a command never joins
    # a group: GitHub keeps one pending run per group and cancels the others,
    # which lost queued commands. A new push cancels the review of the old one;
    # each command gets a group of its own, so none is dropped.
    concurrency:
      group: stratum-${{ github.event_name == 'pull_request_target' && format('review-{0}', github.event.pull_request.number) || github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    timeout-minutes: 60
    steps:
      # The default branch, with history for track records, ownership and hotspots.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./
        with:
          # Runs the model on the runner: no server needed, but slow on CPU.
          # The model examples/stratum.yml recommends: about 3.5 min a PR, plus a
          # couple of minutes to download it, since it's too big for the Actions cache.
          # To use your own server instead, remove this line and set
          # review.endpoint in .stratum/policy.yml (or model-endpoint here).
          ollama-model: gpt-oss:20b
          # The queue job below rebuilds the triage queue, so this job doesn't (new after 0.3.0).
          triage-queue: false

  # Rebuilds the triage queue issue after the stratum job: after each PR's
  # review, when a PR closes or turns back into a draft, after `/stratum review`
  # or `/stratum ignore` or a CI result that re-sorts a PR, and on the daily and
  # manual runs. A comment without a command starts neither job.
  # No model and only a few API calls, but it still waits a minute first
  # (not on the daily and manual runs): every rebuild is in one group, and a
  # newer one cancels it while it waits, so a burst of events costs one rebuild.
  queue:
    # Stratum leaves this job's check runs out of a PR's CI by this name (runner.QUEUE_JOB): keep it.
    name: Stratum triage queue
    needs: stratum
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request_target' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment' || github.event_name == 'workflow_run') &&
        needs.stratum.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: stratum-queue-${{ github.repository }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./queue
