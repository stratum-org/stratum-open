# The coding agents whose pull requests Stratum recognises (`triage.agent_prs`
# in .stratum/policy.yml), and what each one leaves on a PR it writes:
#
#   accounts: GitHub logins that open its PRs. A strong signal.
#   emails:   addresses on its commits, as the commit's author or in a
#             `Co-authored-by:` trailer. A strong signal.
#   markers:  text it puts in the PR's description. A medium signal.
#   branches: globs for the branch names it picks (`*` stays inside one
#             folder, `**` crosses them). A weak signal.
#   sources:  public PRs, commits or the vendor's own docs that show every
#             value above.
#
# Everything is matched without regard to case. To add an agent, or a value to
# one, add a source that shows it; a test checks that each entry has one.
#
# Leave out what a person gets without asking an agent for the change: an
# editor's completions, a description a tool wrote for them, a review bot's
# comments. VS Code's `git.addAICoAuthor` adds `Co-authored-by: Copilot
# <copilot@github.com>` for inline completions too (microsoft/vscode,
# extensions/git/src/repository.ts), and Cursor's editor can add
# `Made-with: Cursor`, so neither is here. CodeRabbit writes a summary into
# people's own PRs, so only the link its coding agent adds is.

agents:
  - name: GitHub Copilot
    accounts: ["Copilot", "copilot-swe-agent[bot]"]
    emails: ["198982749+Copilot@users.noreply.github.com"]
    markers: ["<!-- START COPILOT CODING AGENT SUFFIX -->", "<!-- START COPILOT CODING AGENT TIPS -->"]
    branches: ["copilot/**"]
    sources:
      # Opened by `Copilot`; commits by copilot-swe-agent[bot] <198982749+Copilot@...>; branch copilot/...; the SUFFIX marker.
      - https://github.com/dotnet/runtime/pull/137231
      # The SUFFIX and TIPS markers.
      - https://github.com/dotnet/runtime/pull/122909
      # GitHub's users API gives the login `Copilot` for copilot-swe-agent[bot] (id 198982749).
      - https://api.github.com/users/copilot-swe-agent%5Bbot%5D

  - name: Devin
    accounts: ["devin-ai-integration[bot]"]
    emails: ["158243242+devin-ai-integration[bot]@users.noreply.github.com"]
    markers: ["app.devin.ai/sessions/"]
    branches: ["devin/**"]
    sources:
      # Opened by devin-ai-integration[bot]; a Co-Authored-By trailer with 158243242+...; "Link to Devin session"; branch devin/...
      - https://github.com/calcom/cal.diy/pull/28901

  - name: Cursor
    accounts: ["cursor[bot]"]
    emails: ["cursoragent@cursor.com"]
    markers: ["<!-- CURSOR_AGENT_PR_BODY_BEGIN -->", "cursor.com/background-agent?bcId="]
    branches: ["cursor/**"]
    sources:
      # Opened by a person; commits by Cursor Agent <cursoragent@cursor.com>; both markers; branch cursor/...
      - https://github.com/getsentry/sentry/pull/132050
      # Opened by cursor[bot]; commits by cursoragent@cursor.com.
      - https://github.com/HimanshuRamavat07/HimanshuRamavat07/pull/81
      # Cursor's staff on the `Co-authored-by: Cursor <cursoragent@cursor.com>` trailer its agent adds to the commits it makes.
      - https://forum.cursor.com/t/disable-auto-co-authored-by-cursor-on-agent-commits-or-make-it-opt-in/168258

  - name: OpenAI Codex
    accounts: ["chatgpt-codex-connector[bot]"]
    emails: ["199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"]
    markers: ["chatgpt.com/codex/tasks/"]
    branches: ["codex/**"]
    sources:
      # Opened by a person from a Codex task: the task's link; branch codex/...
      - https://github.com/openai/openai-agents-python/pull/1996
      # Opened by chatgpt-codex-connector[bot], with commits by it; branch codex/...
      - https://github.com/openclaw/openclaw-enterprise/pull/1776

  - name: Jules
    accounts: ["google-labs-jules[bot]"]
    emails: ["161369871+google-labs-jules[bot]@users.noreply.github.com"]
    markers: ["jules.google.com/task/"]
    sources:
      # Commits by google-labs-jules[bot] <161369871+...> in a person's PR.
      - https://github.com/google/bigframes/pull/1789
      # Opened by google-labs-jules[bot].
      - https://github.com/AlbiDR/Clash-Manager/pull/2565
      # "PR created automatically by Jules for task [...](https://jules.google.com/task/...)".
      - https://github.com/gabrielima7/TaipanStack/pull/1335

  - name: OpenHands
    accounts: ["openhands-agent"]
    emails: ["openhands@all-hands.dev", "175740463+openhands-agent@users.noreply.github.com"]
    markers: ["Automatic fix generated by [OpenHands]"]
    branches: ["openhands-fix-issue-*"]
    sources:
      # Opened by openhands-agent, commits by it with `Co-authored-by: openhands <openhands@all-hands.dev>`.
      - https://github.com/OpenHands/OpenHands/pull/19786
      # The resolver's footer, on branch openhands-fix-issue-3.
      - https://github.com/sid288791/store-service/pull/4

  - name: aider
    emails: ["aider@aider.chat"]
    sources:
      # `--attribute-co-authored-by` adds "Co-authored-by: aider (<model>) <aider@aider.chat>".
      - https://github.com/Aider-AI/aider/blob/main/aider/repo.py

  - name: Codegen
    accounts: ["codegen-sh[bot]"]
    emails: ["131295404+codegen-sh[bot]@users.noreply.github.com"]
    markers: ["codegen.com/agent/trace/"]
    sources:
      # Opened by codegen-sh[bot], with commits by it and its "View my work" link.
      - https://github.com/evgenygurin/dj-music-plugin/pull/27

  - name: Amazon Q Developer
    accounts: ["amazon-q-developer[bot]"]
    emails: ["208079219+amazon-q-developer[bot]@users.noreply.github.com"]
    branches: ["Q-DEV-issue-*"]
    sources:
      # Opened by amazon-q-developer[bot], with commits by it; branch Q-DEV-issue-...
      - https://github.com/kohei39san/mystudy-handson/pull/1223

  - name: CodeRabbit
    accounts: ["coderabbitai[bot]"]
    emails: ["136622811+coderabbitai[bot]@users.noreply.github.com"]
    markers: ["app.coderabbit.ai/code/tasks/"]
    branches: ["coderabbit/**"]
    sources:
      # Opened by coderabbitai[bot], with commits by it, its "View coding task" link and branch coderabbit/...
      - https://github.com/rajadilipkolli/my-spring-boot-experiments/pull/2825
