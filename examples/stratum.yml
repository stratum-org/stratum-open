# Copy to .github/workflows/stratum.yml in your repo.
#
# It runs on pull_request_target so it can comment on PRs from forks. That's
# safe here because the workflow checks out your default branch, never the
# PR, and Stratum reads the PR only through the API: no code from the PR runs.
# Don't add a step that checks out or runs the PR's code, unless you opt in to
# the checks that build it (checks.go_vet, checks.clippy): the README says how,
# for PRs from your own branches and not from bots.
name: Stratum

on:
  pull_request_target:
    # closed and converted_to_draft only rebuild the triage queue: the PR leaves it.
    types: [opened, synchronize, reopened, ready_for_review, closed, converted_to_draft]
  issue_comment:
    types: [created]
  # A reply in an inline thread. On a PR from a fork, GitHub gives this run a
  # read-only token, so a reply there can't run a command: each inline comment
  # then names the comment to post on the PR instead (`/stratum ignore <fingerprint>`).
  pull_request_review_comment:
    types: [created]
  # Optional: re-sort a PR when your CI finishes, so its label sees the result.
  # Name your CI workflows here. The event doesn't name a PR from a fork, so
  # Stratum finds it by the run's commit, fork and branch, and re-sorts it if
  # it has reviewed that commit.
  # workflow_run:
  #   workflows: [tests]
  #   types: [completed]
  schedule:
    - cron: "17 6 * * *"  # once a day: rebuild the triage queue issue, and keep Ollama in the cache
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  # Reads the workflow runs, to tell CI waiting for a maintainer's approval (a
  # first-time contributor's PR) from CI that passed. Needed on a private repo.
  actions: read
  # For the code scanning upload at the end of the stratum job: uncomment it with that step.
  # It also lets the job's token change and dismiss code scanning alerts.
  # security-events: write

jobs:
  stratum:
    # A comment starts the job only if it might hold a command: "/stratum " (with the
    # space, so a link to stratum-org/stratum-open doesn't).
    if: >-
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.event.action != 'converted_to_draft') ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_run' ||
      contains(github.event.comment.body, '/stratum ')
    runs-on: ubuntu-latest
    # On the job, not the workflow, so a comment without a command never joins
    # a group: GitHub keeps one pending run per group and cancels the others,
    # which lost queued commands. A new push cancels the review of the old one;
    # each command gets a group of its own, so none is dropped.
    concurrency:
      group: stratum-${{ github.event_name == 'pull_request_target' && format('review-{0}', github.event.pull_request.number) || github.event.comment.id && format('comment-{0}', github.event.comment.id) || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
    timeout-minutes: 60
    steps:
      # The default branch, with history for track records, ownership and hotspots.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # Pin to a commit SHA (stratum-org/stratum-open@<sha>) so a new release reaches you only when you choose.
      - uses: stratum-org/stratum-open@v0.3.0
        with:
          # Runs the model on the runner: no server needed, but slow on CPU.
          # gpt-oss:20b found 16 of 39 planted bugs on this runner, against 1 of 39 for
          # qwen2.5-coder:7b, with about 0.2 wrong comments per clean PR against 0.4, in
          # about 3.5 min a PR against 2.5. Stratum sets review.reasoning: low and
          # review.verify: strict for it unless .stratum/policy.yml sets them.
          # At 13.8 GB it's too big for the Actions cache, so it's downloaded each run
          # (a couple of minutes more), and the action frees disk space for it.
          # For the fastest run, use qwen2.5-coder:7b, which stays in the cache.
          # See "Models" in the README.
          # To use your own server instead, remove this line and set
          # review.endpoint in .stratum/policy.yml (or model-endpoint here).
          ollama-model: gpt-oss:20b
          # Uncomment together with the queue job below, never on its own (see there).
          # triage-queue: false
          # Uncomment together with `security-events: write` above and the step below.
          # sarif: stratum.sarif

      # The findings in Security > Code scanning: "Findings in code scanning" in the README.
      # Commented out until the release after 0.3.0: v0.3.0 has no `sarif` input, so it would
      # write no file and the upload would never run. That release's commit uncomments this
      # step, `sarif` and `security-events: write`, along with the pin bump.
      # - name: Upload the findings to code scanning
      #   if: github.event_name == 'pull_request_target' && hashFiles('stratum.sarif') != ''
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #     PR: ${{ github.event.pull_request.number }}
      #     SHA: ${{ github.event.pull_request.head.sha }}
      #   # For the PR's head, whose lines the findings are on: on pull_request_target, GITHUB_REF and
      #   # GITHUB_SHA are the default branch's. Through the API, since github/codeql-action/upload-sarif
      #   # takes the commit from `git rev-parse HEAD` in the workspace (the default branch here), and
      #   # its `sha` input only when git fails there. Then it waits until code scanning has taken it.
      #   run: |
      #     gzip -c stratum.sarif | base64 -w0 > "$RUNNER_TEMP/stratum.sarif.b64"
      #     id=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/sarifs" -f commit_sha="$SHA" -f ref="refs/pull/$PR/head" \
      #       -f tool_name="Stratum Open" -F sarif=@"$RUNNER_TEMP/stratum.sarif.b64" --jq .id)
