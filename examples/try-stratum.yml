# Copy to .github/workflows/try-stratum.yml in your repo, then run it from the
# Actions tab: "Try Stratum", "Run workflow".
#
# It replays your last closed PRs through Stratum Open's checks and triage:
# the label each would have got, beside whether it was merged. No model runs,
# and nothing is posted: the token below can only read, and the report goes to
# the run's summary page. Anyone who can see the repo can open that page, and
# on a private repo it holds your PR titles.
#
# The workflow's token may make 1,000 API requests an hour in a repo, and a PR
# takes about 5, so 50 PRs take about 260. If GitHub's rate limit stops the
# replay anyway, the summary says how far it got and when the limit resets.
name: Try Stratum

on:
  workflow_dispatch:
    inputs:
      last:
        description: How many closed PRs to replay, newest first
        type: number
        default: 50

permissions:
  contents: read  # the policy file, and the files the checks read in full
  pull-requests: read  # the PRs and their diffs
  checks: read  # each PR's CI as it stood when the PR closed
  statuses: read
  # The workflow runs, to tell CI waiting for a maintainer's approval (a
  # first-time contributor's PR) from CI that passed. Needed on a private repo.
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # `replay --format` isn't in 0.3.0, the latest release, so until the next
      # one this installs stratum-open from its main branch. Once that release
      # is out, install it instead: "stratum-open==<version>".
      - name: Install Stratum Open
        run: python -m pip install --quiet --disable-pip-version-check "stratum-open @ git+https://github.com/stratum-org/stratum-open@main"

      - name: Replay the last closed PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAST: ${{ inputs.last }}
        run: stratum-open replay "$GITHUB_REPOSITORY" --last "$LAST" --format markdown --out "$GITHUB_STEP_SUMMARY"
