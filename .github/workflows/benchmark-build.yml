# The go vet and Clippy checks (benchmark/build_checks.py) on the merged PRs of
# clean-go.json and clean-rust.json, on GitHub's free runners (4 CPUs, no GPU),
# the machine the Action reviews on. Both checks build the PR's code, so each
# project gets a job of its own, and a big Rust build (cargo, nushell) doesn't
# hold up the rest. Start it by hand from the Actions tab; the results come
# back as the build-results artifact, to mark by hand and commit under
# benchmark/results/.
#
# Building a project runs its code (build scripts, procedural macros, cgo, and
# whatever their dependencies do). So it runs only inside a container made from
# benchmark/Dockerfile, never on the runner itself, which holds the runner's own
# token (it can write this repository's Actions cache) and gives passwordless
# sudo. The container gets no token, no Docker socket and no extra privileges.
# It sees two folders of the runner: the PRs' diffs, read-only, and a folder for
# its results. The diffs are fetched first, by a job that builds nothing. Once
# the container is gone, all that's kept of the build is issues.csv, kept.csv
# and prs.json, and only if each is a plain file: the upload and the collect
# job only read them as data.
name: Build-check benchmark

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Projects to build (owner/name, separated by spaces), or all
        default: all

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - id: plan
        env:
          PROJECTS: ${{ inputs.projects }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          wanted = set(os.environ["PROJECTS"].split()) - {"all"}
          jobs = []
          for language in ("go", "rust"):
              with open(f"benchmark/planted/clean-{language}.json", encoding="utf-8") as handle:
                  repos = dict.fromkeys(item["repo"] for item in json.load(handle))
              jobs += [{"repo": r, "safe": r.replace("/", "__"), "language": language} for r in repos if not wanted or r in wanted]
          if wanted - {job["repo"] for job in jobs}:
              raise SystemExit("Not in the lists: " + " ".join(sorted(wanted - {job["repo"] for job in jobs})))
          print("matrix=" + json.dumps({"include": jobs}))
          EOF
      - name: Fetch the PRs' diffs once, for every job
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          read -ra projects <<< "$PROJECTS"
          python benchmark/build_checks.py fetch --repo "${projects[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-cache
          path: benchmark/.cache/
          include-hidden-files: true
          retention-days: 1

  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fetch.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image the projects are built in
        run: docker build --pull -f benchmark/Dockerfile -t stratum-build-checks .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-cache
          path: benchmark/.cache/
      - name: Versions
        run: docker run --rm stratum-build-checks sh -c 'go version; staticcheck -version; cargo clippy --version; python --version'
      - name: Check out each PR and build it, in the container
        timeout-minutes: 310  # leaves the job time to keep and upload what it did
        env:
          REPO: ${{ matrix.repo }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --name build-checks --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE/benchmark/.cache:/src/benchmark/.cache:ro" -v "$RUNNER_TEMP/out:/out" \
            stratum-build-checks python benchmark/build_checks.py run --repo "$REPO" --repos /work/repos --out /out
      - name: Keep only the result files
        if: always()
        env:
          KEEP: raw/${{ matrix.safe }}
        run: |
          # The container must be gone first, so nothing can change a file between its test and its copy.
          docker rm -f build-checks > /dev/null 2>&1 || true
          mkdir -p "$KEEP"
          for name in issues.csv kept.csv prs.json; do
            file="$RUNNER_TEMP/out/$name"
            if [ -f "$file" ] && [ ! -L "$file" ]; then cp -- "$file" "$KEEP/$name"; fi
          done
          ls -l "$KEEP"
      - name: Disk
        if: always()
        run: |
          df -h /
          docker system df
      - if: always()  # a stopped job's partial results are still worth keeping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.safe }}
          path: raw/${{ matrix.safe }}/
          if-no-files-found: ignore

  collect:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results/raw/
      - name: Score
        run: |
          python benchmark/build_checks.py score results
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-results
          path: results/
